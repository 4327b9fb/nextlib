name: Build nextlib static

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: build-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build nextlib static
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Build Project with gradle
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: media3ext-release.aar
          path: ./media3ext/build/outputs/aar/media3ext-release.aar

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: mediainfo-release.aar
          path: ./mediainfo/build/outputs/aar/mediainfo-release.aar
